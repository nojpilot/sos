<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>SOS Zkouška — Test Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e8eaf0;
    --muted: #7a8098;
    --mono: 'Space Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0d0f14 0%, #131828 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-title {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .progress-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    min-width: 180px;
  }

  .progress-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .progress-bar {
    width: 180px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Main layout */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 20px;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card.answered::before { opacity: 1; }

  .question-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 24px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    width: 100%;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(79, 142, 247, 0.08);
  }

  .option-letter {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted);
    min-width: 20px;
    margin-top: 1px;
    transition: color 0.2s;
  }

  .option-text {
    flex: 1;
  }

  .option:disabled { cursor: default; }

  .option.correct {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.1);
  }

  .option.correct .option-letter { color: var(--correct); }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.1);
    opacity: 0.7;
  }

  .option.wrong .option-letter { color: var(--wrong); }

  .option.dim {
    opacity: 0.4;
  }

  /* Feedback icon */
  .option-icon {
    font-size: 14px;
    margin-top: 1px;
    min-width: 18px;
    display: none;
  }

  .option.correct .option-icon,
  .option.wrong .option-icon { display: block; }

  /* Score bar at bottom */
  .score-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(13,15,20,0.95);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 200;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .score-val {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
  }

  .score-val.correct { color: var(--correct); }
  .score-val.wrong { color: var(--wrong); }
  .score-val.total { color: var(--accent); }

  .score-lbl {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
  }

  .score-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
  }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(16px);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0;
  }

  .result-overlay.show { display: flex; }

  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 56px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    position: relative;
    overflow: hidden;
  }

  .result-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--correct));
  }

  .result-emoji {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
  }

  .result-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .result-score {
    font-size: 72px;
    font-weight: 700;
    font-family: var(--mono);
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .result-breakdown {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-bottom: 36px;
  }

  .rb-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .rb-val {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
  }

  .rb-val.c { color: var(--correct); }
  .rb-val.w { color: var(--wrong); }

  .rb-lbl {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
  }

  .result-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 36px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.2s, transform 0.15s;
  }

  .result-btn:hover { opacity: 0.88; transform: translateY(-1px); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card {
    animation: fadeUp 0.35s ease both;
  }

  /* All answered button */
  .finish-btn-wrap {
    display: none;
    text-align: center;
    padding: 20px 0 30px;
  }

  .finish-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 48px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 24px rgba(79,142,247,0.25);
  }

  .finish-btn:hover { opacity: 0.88; transform: translateY(-2px); }

  @media (max-width: 760px) {
    body {
      padding-bottom: calc(82px + env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }

    .header {
      padding: 16px 14px 14px;
      position: sticky;
      top: 0;
    }

    .header-inner {
      display: block;
      max-width: none;
    }

    .header-title {
      font-size: 10px;
      margin-bottom: 3px;
    }

    .header h1 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .progress-wrap {
      align-items: stretch;
      min-width: 0;
      width: 100%;
    }

    .progress-label {
      font-size: 10px;
      text-align: left;
    }

    .progress-bar {
      width: 100%;
      height: 5px;
    }

    .main {
      padding: 18px 10px 26px;
      max-width: none;
    }

    .question-card {
      border-radius: 14px;
      padding: 18px 14px;
      margin-bottom: 14px;
    }

    .question-number {
      font-size: 10px;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .options {
      gap: 9px;
    }

    .option {
      min-height: 48px;
      padding: 13px 12px;
      gap: 10px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      touch-action: manipulation;
    }

    .option-letter {
      min-width: 22px;
      font-size: 11px;
    }

    .score-bar {
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      justify-content: space-around;
      gap: 0;
    }

    .score-divider { display: none; }

    .score-val { font-size: 18px; }
    .score-lbl { font-size: 9px; }

    .finish-btn-wrap {
      padding: 18px 0 8px;
    }

    .finish-btn,
    .result-btn {
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
    }

    .result-overlay {
      padding: 14px;
    }

    .result-box {
      width: 100%;
      padding: 30px 20px;
      border-radius: 20px;
    }

    .result-emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .result-score {
      font-size: 56px;
    }

    .result-breakdown {
      gap: 34px;
      margin-bottom: 28px;
    }
  }

  @media (max-width: 380px) {
    .question-text { font-size: 14px; }
    .option { font-size: 13px; padding: 12px 10px; }
    .header h1 { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">Operační systémy &amp; Sítě</div>
      <h1>Zkušební test</h1>
    </div>
    <div class="progress-wrap">
      <div class="progress-label" id="progress-label">0 / 107 zodpovězeno</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>
</div>

<div class="main" id="quiz-container"></div>

<div class="score-bar">
  <div class="score-item">
    <div class="score-val correct" id="score-correct">0</div>
    <div class="score-lbl">Správně</div>
  </div>
  <div class="score-divider"></div>
  <div class="score-item">
    <div class="score-val wrong" id="score-wrong">0</div>
    <div class="score-lbl">Špatně</div>
  </div>
  <div class="score-divider"></div>
  <div class="score-item">
    <div class="score-val total" id="score-total">107</div>
    <div class="score-lbl">Otázek</div>
  </div>
</div>

<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="result-emoji" id="result-emoji">🎉</span>
    <div class="result-title">Výsledek testu</div>
    <div class="result-score" id="result-pct">0%</div>
    <div class="result-sub" id="result-sub">z 107 otázek</div>
    <div class="result-breakdown">
      <div class="rb-item"><div class="rb-val c" id="rb-correct">0</div><div class="rb-lbl">Správně</div></div>
      <div class="rb-item"><div class="rb-val w" id="rb-wrong">0</div><div class="rb-lbl">Špatně</div></div>
    </div>
    <button class="result-btn" onclick="restartQuiz()">🔄 Zkusit znovu</button>
  </div>
</div>

<script>
const questions = [
  {
    "q": "Pro porty na transportní vrstvě protokolového modelu TCP/IP platí, že:",
    "options": [
      "Porty v rozsahu 49152-65535 se používají na straně serveru. Tyto porty jsou staticky přiděleny konkrétním službám.",
      "Porty v rozsahu 0-1023 se používají v OS UNIX a Linux. Porty v rozsahu 49152-65535 se používají v jiných operačních systémech.",
      "Porty v rozsahu 0-1023 se používají na straně klienta. Číslo portu odpovídá PID procesu.",
      "Porty v rozsahu 0-1023 se používají na straně serveru. Tyto porty jsou staticky přiděleny konkrétním službám."
    ],
    "correct": 3
  },
  {
    "q": "Dávkový systém (způsob plánování běhu procesů):",
    "options": [
      "Používají se tam, kde je potřeba zajistit interaktivitu pro uživatele systému.",
      "Používá se ve výkonných informačních centrech.",
      "Používají se tam, kde je potřeba zajistit předvídatelnost zpracování úloh.",
      "Používá se při řízení časově kritických činností."
    ],
    "correct": 1
  },
  {
    "q": "Segmentace jako způsob správy paměti operačního systému zahrnuje:",
    "options": [
      "Rozdělení paměťového obrazu procesů na úseky pevné velikosti.",
      "Rozdělení paměťového obrazu procesů na logicky související části.",
      "Rozdělení paměťového obrazu procesů na úseky o velikostech násobků čísla 4.",
      "Rozdělení paměťového obrazu procesů na úseky o velikostech násobků čísla 2."
    ],
    "correct": 1
  },
  {
    "q": "Proces je ve stavu „uspán a odložen\". Jakými stavy projde, aby mohl být spuštěn? (devítistavový model)",
    "options": [
      "Je načten do hlavní paměti, přechází do stavu „spící v hlavní paměti\", poté je probuzen, přechází do stavu „živá mrtvola\". Pak počká až jej vybere plánovač jádra.",
      "Po určitém časovém intervalu přechází do stavu „živá mrtvola\" a pak přímo do stavu „běžící v uživatelském režimu\".",
      "Je probuzen, přejde do stavu „připravený ke zpracování, ale odložený\", pak je načten do hlavní paměti, přechází do stavu „připravený ke zpracování v hlavní paměti\", poté počká až jej vybere plánovač jádra.",
      "Počká až jej vybere plánovač pro běh v režimu jádra, žádnými dalšími stavy neprochází."
    ],
    "correct": 2
  },
  {
    "q": "Konfigurační soubory se podle standardu FHS (Filesystem Standard) nachází v adresáři:",
    "options": [
      "/cfg",
      "/sys",
      "/etc",
      "/proc"
    ],
    "correct": 2
  },
  {
    "q": "Kde je umístěn operační systém ve vztahu k dalším částem výpočetního prostředku?",
    "options": [
      "Na stejné úrovni jako vrstva strojového jazyka.",
      "Na stejné úrovni jako aplikační programy.",
      "Na stejné úrovni jako vrstva mikroarchitekury.",
      "Pod úrovní aplikačních programů, navazuje na hardware přes mikroarchitekturu."
    ],
    "correct": 3
  },
  {
    "q": "Služba SSH používá šifrování pomocí veřejného a tajného klíče. Vyberte správné tvrzení:",
    "options": [
      "Šifrování dat se provede tajným klíčem a dešifrování veřejným klíčem.",
      "Šifrování dat se provede veřejným klíčem a dešifrování tajným klíčem.",
      "V případě šifrování tajným klíčem lze data přečíst i bez dešifrování pokud je uživatel root.",
      "V případě šifrování veřejným klíčem lze data přečíst i bez dešifrování pokud je uživatel root."
    ],
    "correct": 1
  },
  {
    "q": "Uvažte základní podmínky synchronizace procesů. Kdy je možné blokovat proces před vstupem do kritické sekce?",
    "options": [
      "Pokud je již jiný proces v kritické sekci.",
      "Pokud NENÍ jakýkoliv proces uživatele administrátor ve své kritické sekci.",
      "Pokud NENÍ proces, který tvoří vrchol hierarchie procesů, ve své kritické sekci.",
      "Pokud NENÍ žádný proces ve své kritické sekci."
    ],
    "correct": 0
  },
  {
    "q": "Mezi přidané moduly modulárního jádra standardně patří:",
    "options": [
      "Ovladače zařízení a souborových systémů.",
      "Software zajišťující multitasking.",
      "Správce procesů.",
      "Software zajišťující virtuální paměť."
    ],
    "correct": 0
  },
  {
    "q": "O modulárním monolitickém jádru operačního systému platí, že:",
    "options": [
      "Moduly monolitickému jádru poskytují možnost transformace do jiného typu jádra za běhu.",
      "Obsahuje pouze základní části; další části v podobě modulů jsou dynamicky načítány v případě potřeby.",
      "Načítání modulů může probíhat pouze při startu operačního systému.",
      "Použité moduly pracují jako procesy v uživatelském režimu."
    ],
    "correct": 1
  },
  {
    "q": "Jádro operačního systému je:",
    "options": [
      "Potřeba pouze pro zápis a čtení dat z paměťového média.",
      "Aktivní jenom při startu operačního systému.",
      "Aktivní jenom po dobu síťové komunikace.",
      "Stále aktivní a pracuje přímo s hardware počítače. Prostřednictvím systémových volání poskytuje služby systémových programů."
    ],
    "correct": 3
  },
  {
    "q": "Když proces za běhu dynamicky alokuje více datového prostoru, je použita jeho část uživatelského kontextu nazvaná:",
    "options": [
      "Data jádra.",
      "Halda (heap).",
      "Zásobník (stack).",
      "Textová."
    ],
    "correct": 1
  },
  {
    "q": "Ve vzorci „priorita = využitíCPU/2 + nice + báze\" hodnota „nice\" značí:",
    "options": [
      "Modifikovatelný parametr, pomocí kterého může uživatel/administrátor ovlivňovat hodnotu priority zvoleného procesu.",
      "Relativní priority události napevno zakompilovány v systému.",
      "Hodnotu, pomocí které je automaticky ovlivňována priorita na základě velikosti zabrané paměti.",
      "Průměr počtu taktů za sekundu, které proces spotřeboval za uplynulých několik sekund."
    ],
    "correct": 0
  },
  {
    "q": "Celočíselný identifikátor procesu (PID) je typicky přidělován podle následujícího pravidla:",
    "options": [
      "PID je odvozeno od ID uživatele, který proces spustil.",
      "Přiděluje se při vytváření procesu.",
      "Přiděluje se podle funkce procesu, více procesů může mít stejné PID.",
      "Přiděluje se podle funkce procesu, každý proces musí mít jedinečné PID."
    ],

      "Automatické zvyšování priority procesů, které patří uživateli žádajícímu o komunikaci.",
      "Nekonzistence dat."
    ],
    "correct": 3
  },
  {
    "q": "Vyberte CHYBNÝ popis speciálních souborů, které se používají pro přístup k zařízením připojeným do systému:",
    "options": [
      "Speciální soubory přinášejí velkou míru abstrakce, protože se zařízeními lze pracovat pomocí univerzálních funkcí zápisu a čtení.",
      "Speciální soubory mohou reprezentovat i softwarová zařízení.",
      "Speciální soubory nelze použít pro bloková zařízení.",
      "Speciální soubory může operační systém vytvářet automaticky podle stavu připojených zařízení."
    ],
    "correct": 2
  },
  {
    "q": "Paket je jednotkou bloku dat které vrstvy referenčního modelu OSI?",
    "options": [
      "Transportní.",
      "Síťové.",
      "Linkové/spojové.",
      "Fyzické."
    ],
    "correct": 1
  },
  {
    "q": "Sekundární hierarchie adresářů vztažená k uživatelům operačního systému se podle standardu FHS nachází v adresáři:",
    "options": [
      "/etc",
      "/usr",
      "/lib",
      "/var"
    ],
    "correct": 1
  },
  {
    "q": "Minimálně které vrstvy referenčního modelu OSI musí mít implementován směrovač (router), který lze vzdáleně spravovat v síti Internet?",
    "options": [
      "Pouze aplikační.",
      "Všechny.",
      "Fyzickou, linkovou/spojovou a síťovou.",
      "Fyzickou a linkovou/spojovou."
    ],
    "correct": 1
  },
  {
    "q": "Příznak v segmentu TCP zvaný SYN značí, že se jedná o:",
    "options": [
      "Segment nesoucí žádost o navázání spojení.",
      "Segment potvrzující ukončení spojení.",
      "Segment potvrzující přijatou žádost o navázání spojení.",
      "Segment ukončující spojení."
    ],
    "correct": 0
  },
  {
    "q": "Najdi chybu: Správa paměti operačního systému pomocí stránkování:",
    "options": [
      "Je pro procesy plně transparentní děj.",
      "Fyzická paměť je rozdělena na stejně velké rámce (frames).",
      "Zaručuje souvislé umístění dat procesu v hlavní paměti, které logicky patří k sobě.",
      "Adresní prostor tvoří stránky stejné velikosti."
    ],
    "correct": 2
  }
];

let answered = 0;
let correct = 0;
let wrong = 0;
const answeredSet = new Set();

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const letters = ['a', 'b', 'c', 'd'];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${Math.min(qi * 0.012, 0.35)}s`;

    let optionsHtml = q.options.map((opt, oi) => `
      <button class="option" onclick="selectOption(${qi}, ${oi})" id="opt-${qi}-${oi}">
        <span class="option-letter">${letters[oi]})</span>
        <span class="option-text">${opt}</span>
        <span class="option-icon" id="icon-${qi}-${oi}"></span>
      </button>
    `).join('');

    card.innerHTML = `
      <div class="question-number">Otázka ${qi + 1} / ${questions.length}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${optionsHtml}</div>
    `;
    container.appendChild(card);
  });

  const finishWrap = document.createElement('div');
  finishWrap.className = 'finish-btn-wrap';
  finishWrap.id = 'finish-wrap';
  finishWrap.innerHTML = `<button class="finish-btn" onclick="showResults()">Zobrazit výsledky →</button>`;
  container.appendChild(finishWrap);

  updateScoreBar();
}

function selectOption(qi, oi) {
  if (answeredSet.has(qi)) return;
  answeredSet.add(qi);

  const q = questions[qi];
  const card = document.getElementById(`card-${qi}`);
  card.classList.add('answered');

  // Disable all options for this question
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;

    if (i === q.correct) {
      btn.classList.add('correct');
      document.getElementById(`icon-${qi}-${i}`).textContent = '✓';
    } else if (i === oi && oi !== q.correct) {
      btn.classList.add('wrong');
      document.getElementById(`icon-${qi}-${i}`).textContent = '✗';
    } else {
      btn.classList.add('dim');
    }
  }

  answered++;
  if (oi === q.correct) {
    correct++;
  } else {
    wrong++;
  }

  updateScoreBar();

  if (answered === questions.length) {
    document.getElementById('finish-wrap').style.display = 'block';
    document.getElementById('finish-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function updateScoreBar() {
  document.getElementById('score-correct').textContent = correct;
  document.getElementById('score-wrong').textContent = wrong;
  document.getElementById('score-total').textContent = questions.length;

  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answered} / ${questions.length} zodpovězeno`;
}

function showResults() {
  const pct = Math.round((correct / questions.length) * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '📚' : '💪';

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-pct').textContent = pct + '%';
  document.getElementById('result-sub').textContent = `${correct} z ${questions.length} správně`;
  document.getElementById('rb-correct').textContent = correct;
  document.getElementById('rb-wrong').textContent = wrong;

  document.getElementById('result-overlay').classList.add('show');
}

function restartQuiz() {
  answered = 0;
  correct = 0;
  wrong = 0;
  answeredSet.clear();
  document.getElementById('result-overlay').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
