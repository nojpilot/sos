<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Zkouška — Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e8eaf0;
    --muted: #7a8098;
    --mono: 'Space Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0d0f14 0%, #131828 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-title {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .progress-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    min-width: 180px;
  }

  .progress-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .progress-bar {
    width: 180px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Main layout */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 20px;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card.answered::before { opacity: 1; }

  .question-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 24px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    width: 100%;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(79, 142, 247, 0.08);
  }

  .option-letter {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted);
    min-width: 20px;
    margin-top: 1px;
    transition: color 0.2s;
  }

  .option-text {
    flex: 1;
  }

  .option:disabled { cursor: default; }

  .option.correct {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.1);
  }

  .option.correct .option-letter { color: var(--correct); }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.1);
    opacity: 0.7;
  }

  .option.wrong .option-letter { color: var(--wrong); }

  .option.dim {
    opacity: 0.4;
  }

  /* Feedback icon */
  .option-icon {
    font-size: 14px;
    margin-top: 1px;
    min-width: 18px;
    display: none;
  }

  .option.correct .option-icon,
  .option.wrong .option-icon { display: block; }

  /* Score bar at bottom */
  .score-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(13,15,20,0.95);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 200;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .score-val {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
  }

  .score-val.correct { color: var(--correct); }
  .score-val.wrong { color: var(--wrong); }
  .score-val.total { color: var(--accent); }

  .score-lbl {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
  }

  .score-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
  }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(16px);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0;
  }

  .result-overlay.show { display: flex; }

  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 56px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    position: relative;
    overflow: hidden;
  }

  .result-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--correct));
  }

  .result-emoji {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
  }

  .result-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .result-score {
    font-size: 72px;
    font-weight: 700;
    font-family: var(--mono);
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .result-breakdown {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-bottom: 36px;
  }

  .rb-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .rb-val {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
  }

  .rb-val.c { color: var(--correct); }
  .rb-val.w { color: var(--wrong); }

  .rb-lbl {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
  }

  .result-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 36px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.2s, transform 0.15s;
  }

  .result-btn:hover { opacity: 0.88; transform: translateY(-1px); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card {
    animation: fadeUp 0.35s ease both;
  }

  /* All answered button */
  .finish-btn-wrap {
    display: none;
    text-align: center;
    padding: 20px 0 30px;
  }

  .finish-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 48px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 24px rgba(79,142,247,0.25);
  }

  .finish-btn:hover { opacity: 0.88; transform: translateY(-2px); }

  @media (max-width: 600px) {
    .header { padding: 20px 16px; }
    .main { padding: 24px 12px 80px; }
    .question-card { padding: 20px 16px; }
    .result-box { padding: 32px 24px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">Operační systémy &amp; Sítě</div>
      <h1>Zkušební test</h1>
    </div>
    <div class="progress-wrap">
      <div class="progress-label" id="progress-label">0 / 107 zodpovězeno</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>
</div>

<div class="main" id="quiz-container"></div>

<div class="score-bar">
  <div class="score-item">
    <div class="score-val correct" id="score-correct">0</div>
    <div class="score-lbl">Správně</div>
  </div>
  <div class="score-divider"></div>
  <div class="score-item">
    <div class="score-val wrong" id="score-wrong">0</div>
    <div class="score-lbl">Špatně</div>
  </div>
  <div class="score-divider"></div>
  <div class="score-item">
    <div class="score-val total" id="score-total">107</div>
    <div class="score-lbl">Otázek</div>
  </div>
</div>

<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="result-emoji" id="result-emoji">🎉</span>
    <div class="result-title">Výsledek testu</div>
    <div class="result-score" id="result-pct">0%</div>
    <div class="result-sub" id="result-sub">z 107 otázek</div>
    <div class="result-breakdown">
      <div class="rb-item"><div class="rb-val c" id="rb-correct">0</div><div class="rb-lbl">Správně</div></div>
      <div class="rb-item"><div class="rb-val w" id="rb-wrong">0</div><div class="rb-lbl">Špatně</div></div>
    </div>
    <button class="result-btn" onclick="restartQuiz()">🔄 Zkusit znovu</button>
  </div>
</div>

<script>
// Quiz data and logic intentionally kept as provided.
const questions = [];

let answered = 0;
let correct = 0;
let wrong = 0;
const answeredSet = new Set();

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const letters = ['a', 'b', 'c', 'd'];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.03}s`;

    const optionsHtml = q.options.map((opt, oi) => `
      <button class="option" onclick="selectOption(${qi}, ${oi})" id="opt-${qi}-${oi}">
        <span class="option-letter">${letters[oi]})</span>
        <span class="option-text">${opt}</span>
        <span class="option-icon" id="icon-${qi}-${oi}"></span>
      </button>
    `).join('');

    card.innerHTML = `
      <div class="question-number">Otázka ${qi + 1} / ${questions.length}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${optionsHtml}</div>
    `;
    container.appendChild(card);
  });

  const finishWrap = document.createElement('div');
  finishWrap.className = 'finish-btn-wrap';
  finishWrap.id = 'finish-wrap';
  finishWrap.innerHTML = `<button class="finish-btn" onclick="showResults()">Zobrazit výsledky →</button>`;
  container.appendChild(finishWrap);

  updateScoreBar();
}

function selectOption(qi, oi) {
  if (answeredSet.has(qi)) return;
  answeredSet.add(qi);

  const q = questions[qi];
  const card = document.getElementById(`card-${qi}`);
  card.classList.add('answered');

  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;

    if (i === q.correct) {
      btn.classList.add('correct');
      document.getElementById(`icon-${qi}-${i}`).textContent = '✓';
    } else if (i === oi && oi !== q.correct) {
      btn.classList.add('wrong');
      document.getElementById(`icon-${qi}-${i}`).textContent = '✗';
    } else {
      btn.classList.add('dim');
    }
  }

  answered++;
  if (oi === q.correct) {
    correct++;
  } else {
    wrong++;
  }

  updateScoreBar();

  if (answered === questions.length) {
    document.getElementById('finish-wrap').style.display = 'block';
    document.getElementById('finish-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function updateScoreBar() {
  document.getElementById('score-correct').textContent = correct;
  document.getElementById('score-wrong').textContent = wrong;
  document.getElementById('score-total').textContent = questions.length;

  const pct = questions.length ? Math.round((answered / questions.length) * 100) : 0;
  document.getElementById('progress-fill').style.width = `${pct}%`;
  document.getElementById('progress-label').textContent = `${answered} / ${questions.length} zodpovězeno`;
}

function showResults() {
  const pct = questions.length ? Math.round((correct / questions.length) * 100) : 0;
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '📚' : '💪';

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-pct').textContent = `${pct}%`;
  document.getElementById('result-sub').textContent = `${correct} z ${questions.length} správně`;
  document.getElementById('rb-correct').textContent = correct;
  document.getElementById('rb-wrong').textContent = wrong;

  document.getElementById('result-overlay').classList.add('show');
}

function restartQuiz() {
  answered = 0;
  correct = 0;
  wrong = 0;
  answeredSet.clear();
  document.getElementById('result-overlay').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
</body>
</html>
